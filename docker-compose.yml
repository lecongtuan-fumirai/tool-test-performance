services:
  backend:
    image: node:20-alpine
    working_dir: /app/backend
    volumes:
      - ./:/app
    ports:
      - "3334:3334"
    command: sh -c "corepack enable && pnpm install && pnpm run dev"
    environment:
      - PORT=3334

  frontend:
    image: node:20-alpine
    working_dir: /app/frontend
    volumes:
      - ./:/app
    ports:
      - "3333:3333"
    command: sh -c "corepack enable && pnpm install && pnpm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
