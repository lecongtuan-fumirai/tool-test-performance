<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="kp-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#06b6d4" flood-opacity="0.8"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Container with Glowing Gradient Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg-grad)" stroke="url(#kp-grad)" stroke-width="2.5"/>
  
  <!-- Kubernetes Nodes Ring -->
  <circle cx="32" cy="14" r="3" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="48" cy="23" r="2.5" fill="#3b82f6"/>
  <circle cx="48" cy="41" r="2.5" fill="#10b981"/>
  <circle cx="32" cy="50" r="3" fill="#10b981" filter="url(#glow)"/>
  <circle cx="16" cy="41" r="2.5" fill="#06b6d4"/>
  <circle cx="16" cy="23" r="2.5" fill="#38bdf8"/>
  
  <!-- Constellation Connections -->
  <path d="M 32 14 L 48 23 L 48 41 L 32 50 L 16 41 L 16 23 Z" stroke="#334155" stroke-width="1.2" stroke-dasharray="2 2" fill="none"/>
  
  <!-- Vibrant Pulse Line (ECG / Heartbeat) in Center -->
  <path d="M 12 32 L 22 32 L 27 20 L 32 44 L 37 25 L 42 34 L 52 32" 
        stroke="url(#kp-grad)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>
        
  <!-- Core Spark Dot -->
  <circle cx="37" cy="25" r="2" fill="#ffffff"/>
</svg>

